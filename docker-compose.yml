version: '3.8'

services:
  moderation-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENABLE_POLICY_ENGINE=true
      - POLICY_FILE=policy.json
    volumes:
      - ./policy.json:/app/policy.json
    command: uvicorn moderation_service:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
